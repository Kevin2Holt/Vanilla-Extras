name: Temporary sprite export

on:
  push:
    paths:
      - '.github/workflows/sprites.yml'

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Minecraft
        run: ./gradlew compileJava -q || true
      - name: Extract sprites
        run: |
          J=$(find ~/.gradle .gradle -name 'minecraft-client-only.jar' -o -name 'minecraft-clientOnly-*.jar' | head -1)
          echo "JAR $J"
          mkdir -p out
          unzip -o -q "$J" 'assets/minecraft/textures/mob_effect/*' 'assets/minecraft/textures/gui/sprites/hud/food*' 'assets/minecraft/textures/gui/sprites/container/beacon/*' 'assets/minecraft/textures/gui/container/beacon.png' -d out
          find out -type f | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: sprites
          path: out
