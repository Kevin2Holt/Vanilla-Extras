name: Inspect vanilla sources

on:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sources
        run: ./gradlew genSources --stacktrace || ./gradlew genSourcesWithVineflower --stacktrace
      - name: Dump networking API
        run: |
          mkdir -p fapi
          for j in $(find ~/.gradle .gradle -name 'fabric-networking-api-v1*.jar' -o -name 'fabric-lifecycle-events*sources*.jar' 2>/dev/null); do echo "JAR $j"; unzip -o -q "$j" -d fapi || true; done
          cd fapi
          find . -name '*.java' | grep -i 'networking/v1' | head -60
          for f in $(find . -path '*networking/v1/*' \( -name 'PayloadTypeRegistry.java' -o -name 'ServerPlayNetworking.java' -o -name 'ClientPlayNetworking.java' -o -name 'ServerPlayConnectionEvents.java' -o -name 'ClientPlayConnectionEvents.java' \)); do echo "===== $f"; grep -n 'public\|static' "$f" | grep -v '^\s*\*'; done
          find ~/.gradle -iname '*mixinextras*' | head
          cd ..; mkdir -p d2; for j in $(find ~/.gradle .gradle -name '*minecraft*sources*.jar' 2>/dev/null); do unzip -o -q "$j" -d d2 || true; done
          echo "===== CustomPacketPayload"; cat $(find d2 -name CustomPacketPayload.java) | grep -v '^import'
          echo "===== ByteBufCodecs list/string"; grep -n 'STRING_UTF8\|static .* list(\|collection(' $(find d2 -name ByteBufCodecs.java) | head
