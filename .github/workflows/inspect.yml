name: Inspect vanilla sources

on:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve deps
        run: ./gradlew dependencies --configuration compileClasspath -q > /dev/null || true
      - name: Dump networking API
        run: |
          J=$(find ~/.gradle -name 'fabric-networking-api-v1-*.jar' | grep -v sources | head -1)
          echo "NETJAR $J"
          for c in PayloadTypeRegistry ServerPlayNetworking ClientPlayNetworking 'ServerPlayConnectionEvents$Join' 'ClientPlayConnectionEvents$Disconnect' ServerPlayConnectionEvents ClientPlayConnectionEvents 'ClientPlayNetworking$PlayPayloadHandler' 'ClientPlayNetworking$Context'; do
            cls=$(unzip -l "$J" | awk '{print $4}' | grep -F "/$c.class" | head -1)
            if [ -n "$cls" ]; then javap -cp "$J" "${cls%.class}"; else echo "missing $c"; fi
          done
          L=$(find ~/.gradle -name 'fabric-loader-*.jar' | grep -v sources | head -1); echo "LOADER $L"; unzip -l "$L" | grep -i mixinextras | head -3
          find ~/.gradle -iname '*mixinextras*.jar' | head -3
