name: Inspect vanilla sources

on:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sources
        run: ./gradlew genSources --stacktrace || ./gradlew genSourcesWithVineflower --stacktrace
      - name: Dump beacon sources
        run: |
          mkdir -p dump
          find ~/.gradle .gradle -name '*minecraft*sources*.jar' 2>/dev/null | tee jars.txt
          for j in $(cat jars.txt); do unzip -o -q "$j" -d dump || true; done
          find ~/.gradle .gradle -name '*minecraft*.jar' 2>/dev/null | grep -v sources | head -20
          cd dump
          for f in $(find . -name 'BeaconBlockEntity.java' -o -name 'BeaconMenu.java' -o -name 'BeaconScreen.java' -o -name 'SaturationMobEffect.java' -o -name 'ServerboundSetBeaconPacket.java'); do echo "===== $f"; cat "$f"; done
          echo "===== MobEffects"; grep -n 'SATURATION\|STRENGTH\|REGENERATION' $(find . -name MobEffects.java)
          echo "===== handleSetBeaconPacket"; grep -n -A15 'handleSetBeaconPacket' $(find . -name ServerGamePacketListenerImpl.java)
          echo "===== BEACON_EFFECTS usages"; grep -rln 'BEACON_EFFECTS\|VALID_EFFECTS' . || true
      - name: List saturation assets
        run: |
          for j in $(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i 'minecraft' | grep -v sources); do unzip -l "$j" 2>/dev/null | grep -i 'saturation' && echo "  ^ in $j"; done || true
