name: Temporary API inspection

on:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate sources
        run: ./gradlew genSources -q || true
      - name: Dump gametest APIs
        run: |
          J=$(find ~/.gradle -name 'fabric-gametest-api-v1-*.jar' | grep -v sources | head -1); echo "GTJAR $J"
          [ -n "$J" ] && unzip -l "$J" | awk '{print $4}' | grep '\.class$' | grep -v impl | head -30
          for cls in $(unzip -l "$J" | awk '{print $4}' | grep 'api/.*\.class$'); do javap -cp "$J" "${cls%.class}"; done
          mkdir -p d; for j in $(find ~/.gradle .gradle -name '*minecraft*sources*.jar' 2>/dev/null); do unzip -o -q "$j" -d d || true; done
          echo "===== GameTestHelper"; grep -n 'public .*(' $(find d -name GameTestHelper.java) | grep -i 'mock\|setBlock\|assert\|succeed\|absolute\|getBlockEntity\|runAfterDelay\|getLevel\|fail(' | head -60
          echo "===== gametest dir"; find d -path '*gametest/framework*' -name '*.java' | head -60
          echo "===== GameTest annotation"; find d -name 'GameTest*.java' | head; 
          echo "===== loom configureTests"; find ~/.gradle -path '*fabric-loom*' -name '*.jar' | head -3
          echo "===== FabricGameTest-ish"; find ~/.gradle -name 'fabric-api-*.jar' | head -3
