name: Probe refill

on:
  push:
    branches: [claude/project-thread-8xpw8f]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew compileClientJava --stacktrace
      - name: Probe
        run: |
          set +e
          CP=$(find ~/.gradle/caches -name '*.jar' | grep -iE 'fabric-loom.*minecraft|fabric-networking|fabric-lifecycle|fabric-api-base' | tr '\n' ':')
          for C in net.minecraft.world.item.ItemInstance net.minecraft.world.item.ItemStackTemplate net.minecraft.world.item.component.ContainerComponent net.minecraft.core.component.DataComponentHolder net.minecraft.core.component.DataComponentGetter; do
            echo "=== $C"; javap -cp "$CP" "$C"; done
          echo "=== Minecraft screen"
          javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -iE 'screen|Gui '
          javap -cp "$CP" net.minecraft.client.gui.Gui | grep -iE 'screen'
