name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-extras
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: TEMP dump Minecraft signatures
        if: always()
        run: |
          find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -vi sources | head -20
          for jar in $(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft-(common|clientOnly|merged)' | grep -vi sources); do
            echo "=== $jar"
            javap -cp "$jar" -p net.minecraft.server.level.ServerPlayerGameMode net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.world.item.BlockItem net.minecraft.world.item.context.BlockPlaceContext net.minecraft.network.protocol.game.ClientboundSoundPacket 2>&1 | grep -iE 'class|useItemOn|performUseItemOn|place|BlockPlaceContext\(|ClientboundSoundPacket\(' || true
          done
