name: Temporary server smoke test

on:
  push:
    paths:
      - '.github/workflows/smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Force beacon class load at startup
        run: |
          sed -i 's|LOGGER.info("Vanilla Extras initialized");|LOGGER.info("SMOKE beacon effects: {}", net.minecraft.world.level.block.entity.BeaconBlockEntity.BEACON_EFFECTS); LOGGER.info("SMOKE validate saturation II: {} / regen: {} / sat at tier2: {}", net.minecraft.world.level.block.entity.BeaconBlockEntity.validateEffects(net.minecraft.world.effect.MobEffects.SATURATION, net.minecraft.world.effect.MobEffects.SATURATION, 4), net.minecraft.world.level.block.entity.BeaconBlockEntity.validateEffects(net.minecraft.world.effect.MobEffects.SATURATION, net.minecraft.world.effect.MobEffects.REGENERATION, 4), net.minecraft.world.level.block.entity.BeaconBlockEntity.validateEffects(net.minecraft.world.effect.MobEffects.SATURATION, null, 2));|' src/main/java/com/kevin2holt/vanillaextras/VanillaExtras.java
      - name: Run dedicated server
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          (sleep 400; echo stop) | timeout 600 ./gradlew runServer --args="nogui" 2>&1 | tee server.log || true
          echo "===== SMOKE"; grep -n 'SMOKE\|Mixin\|mixin\|ERROR\|Exception\|Done (' server.log | head -60
          echo "===== CONFIG"; cat run/config/vanilla-extras.json || true
