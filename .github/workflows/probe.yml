name: Probe

on:
  push:
    branches: [claude/project-thread-1eniq2]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew compileClientJava --stacktrace
      - name: Probe
        run: |
          set +e
          curl -s https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml | tail -30
          find ~/.gradle/caches -name '*.jar' | grep -iE 'minecraft|fabric-screen-api' | head -40
          CP=$(find ~/.gradle/caches -name '*.jar' | grep -iE 'fabric-loom.*minecraft' | tr '\n' ':')
          for J in $(find ~/.gradle/caches -name '*.jar' | grep -iE 'fabric-loom.*minecraft'); do unzip -l $J | grep -iE 'OptionsScreen|OptionsSubScreen|OptionsList|OptionInstance|gui/layouts/' ; done
          P=net.minecraft.client
          for C in $P.gui.screens.Screen $P.gui.screens.options.OptionsScreen $P.gui.screens.options.OptionsSubScreen $P.gui.components.OptionsList '$P.OptionInstance' $P.gui.components.Button '$P.gui.components.Button$Builder' $P.gui.layouts.HeaderAndFooterLayout $P.gui.layouts.GridLayout '$P.gui.layouts.GridLayout$RowHelper' $P.gui.layouts.LinearLayout $P.gui.components.StringWidget $P.gui.components.AbstractSliderButton $P.gui.components.CycleButton $P.gui.components.Tooltip $P.gui.components.ContainerObjectSelectionList $P.gui.components.AbstractSelectionList '$P.OptionInstance$IntRange' '$P.OptionInstance$TooltipSupplier' '$P.OptionInstance$CaptionBasedToString' '$P.gui.components.OptionsList$Entry' $P.gui.components.AbstractContainerWidget $P.gui.layouts.Layout $P.gui.layouts.LayoutSettings; do
            C=$(eval echo "$C"); echo "=== $C"; javap -cp "$CP" "$C"; done
          echo "=== OptionsScreen bytecode"
          javap -c -p -cp "$CP" net.minecraft.client.gui.screens.options.OptionsScreen | sed -n '1,400p'
          echo "=== OptionsSubScreen bytecode"
          javap -c -p -cp "$CP" net.minecraft.client.gui.screens.options.OptionsSubScreen | sed -n '1,200p'
          echo "=== OptionsList private"
          javap -p -cp "$CP" net.minecraft.client.gui.components.OptionsList
          for J in $(find ~/.gradle/caches -name '*.jar' | grep -iE 'fabric-screen-api'); do unzip -l $J | grep -i class; done
